<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f9fafb;
      color: #111827;
    }
    h3 {
      margin-top: 0;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 10px;
    }
    #list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
    }
    .row-text {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
      margin-right: 8px;
    }
    .row-name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 2px;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }
    .row-val {
      font-size: 12px;
      color: #6b7280;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }
    .del {
      background: none;
      border: none;
      cursor: pointer;
      color: #ef4444;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .del:hover {
      background: #fee2e2;
    }
    .del svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }
    hr {
      border: 0;
      border-top: 1px solid #e5e7eb;
      margin: 14px 0;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-family: inherit;
      font-size: 13px;
    }
    textarea {
      resize: vertical;
      min-height: 52px;
    }
    button.btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.15s;
    }
    button.btn-primary:hover {
      background: #1d4ed8;
    }
    button.btn-secondary {
      background: #374151;
      color: #ffffff;
      border: none;
      padding: 8px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.15s;
    }
    button.btn-secondary:hover {
      background: #1f2937;
    }
    button.btn-secondary.copied {
      background: #16a34a;
    }
    .empty-state {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      padding: 10px 0;
      font-style: italic;
    }
    .preview-box {
      min-height: 22px;
      padding: 6px 10px;
      background: #ffffff;
      border: 1px dashed #d1d5db;
      border-radius: 5px;
      font-size: 13px;
      color: #374151;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h3>Manage Labels</h3>
  <div id="list"></div>

  <hr>

  <h3>Add New Label</h3>
  <div class="input-group">
    <input id="name" placeholder="Label name (e.g. Email)">
    <textarea id="value" placeholder="Text to paste"></textarea>
    <button id="save" class="btn-primary">Save Label</button>
  </div>

  <hr>

  <h3>Quick Superscript</h3>
  <div class="input-group">
    <input id="superInput" placeholder="Type text (e.g. 2nd, mc2, x+y=z)">
    <div id="superResult" class="preview-box">Preview appears here</div>
    <button id="copySuper" class="btn-secondary" type="button">Copy Superscript</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
